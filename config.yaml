dataset:
  name: dance_analysis
  annotation_version: 1.2.0
  
image:
  width: 336
  height: 448
  bbox_padding: 0.05

backbone:
  name: dino_v2_base
  type: vit
  patch_size: 14
  hidden_size: 768

head:
  name: depthwise_simcc
  type: simcc
  keypoint_format_name: dance_20
  in_channels: 768
  out_channels: 256
  normalization: group_norm
  groups: 32
  activation: gelu

  custom:
    pointwise_convolutions: 2
    depthwise_kernel: 3
    split_ratio: 2.0
    x_bins: 672
    y_bins: 896
    gaussian_sigma: 6.0
    pooling: adaptive_avg_pool2d

training:
  seed: 42
  batch_size: 4
  max_epochs: 15
  early_stopping_patience: 6
  learning_rate: 0.001
  weight_decay: 0.0001
  train_test_split: 0.8
  gradient_clip_norm: 1.0
  augmentation_repeats: 4