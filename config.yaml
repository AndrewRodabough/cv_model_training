dataset:
  name: dance_analysis
  annotation_version: 1.3.0
  
image:
  width: 384
  height: 512
  bbox_padding: 0.0

backbone:
  name: dino_v3_base
  type: vit
  patch_size: 16
  hidden_size: 768

head:
  name: depthwise_simcc
  type: simcc
  keypoint_format_name: dance_20
  in_channels: 768
  out_channels: 256
  normalization: group_norm
  groups: 32
  activation: gelu

  custom:
    pointwise_convolutions: 2
    depthwise_kernel: 3
    split_ratio: 2.0
    x_bins: 768
    y_bins: 1024
    gaussian_sigma: 6.0
    pooling: adaptive_avg_pool2d

training:
  seed: 43
  batch_size: 4
  max_epochs: 15
  early_stopping_patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  train_test_split: 0.8
  split_mode: stratified_clip
  gradient_clip_norm: 1.0
  augmentation_repeats: 4
  worst_test_overlays: 10
  joint_loss_weights:
    shoulder_l: 1.5
    shoulder_r: 1.5
    elbow_l: 1.4
    elbow_r: 1.4
    wrist_l: 1.15
    wrist_r: 1.15
    hip_l: 1.5
    hip_r: 1.5
    knee_l: 1.4
    knee_r: 1.4
    ankle_l: 1.15
    ankle_r: 1.15
    toe_b_l: 1.0
    toe_b_r: 1.0
    toe_s_l: 1.0
    toe_s_r: 1.0
    heel_l: 1.0
    heel_r: 1.0
    heel_spike_l: 1.0
    heel_spike_r: 1.0