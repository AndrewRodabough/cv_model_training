dataset:
  name: dance_analysis
  annotation_version: 1.3.8
  
image:
  width: 384
  height: 512
  bbox_padding: 0.05

backbone:
  name: dino_v3_base
  type: vit
  patch_size: 16
  hidden_size: 768

head:
  # joint_query_simcc | joint_query_self_attn_simcc | depthwise_simcc
  name: joint_query_self_attn_simcc
  type: simcc
  keypoint_format_name: dance_20
  in_channels: 768
  out_channels: 256
  normalization: group_norm
  groups: 32
  activation: gelu

  custom:
    split_ratio: 2.0
    x_bins: 768
    y_bins: 1024
    gaussian_sigma: 6.0
    num_heads: 8
    num_layers: 2
    dropout: 0.06
    # Soft-anchor foot queries to same-side ankle before self/cross-attn
    soft_foot_anchor: false
    soft_foot_anchor_init: 0.0

training:
  seed: 43
  batch_size: 4
  max_epochs: 60
  early_stopping_patience: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  train_test_split: 0.8
  split_mode: stratified_clip
  gradient_clip_norm: 1.0
  augmentation_repeats: 8
  aug_scale_min: 0.85
  aug_scale_max: 1.25
  aug_shift_frac: 0.1
  aug_rotation_deg: 12.0
  aug_color_jitter: 0.25
  worst_test_overlays: 15
  compute_ap: true
  joint_loss_weights:
    shoulder_l: 1.2
    shoulder_r: 1.2
    elbow_l: 1.1
    elbow_r: 1.1
    wrist_l: 1.05
    wrist_r: 1.05
    hip_l: 1.2
    hip_r: 1.2
    knee_l: 1.15
    knee_r: 1.15
    ankle_l: 1.1
    ankle_r: 1.1
    toe_b_l: 1.0
    toe_b_r: 1.0
    toe_s_l: 1.0
    toe_s_r: 1.0
    heel_l: 1.1
    heel_r: 1.1
    heel_spike_l: 1.0
    heel_spike_r: 1.0