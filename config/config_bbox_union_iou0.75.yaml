# Union partners when IoU >= 0.75. Train soft-band [0.70, 0.80]: random union OR
# separate near the boundary. Val uses hard 0.75 only.

dataset:
  annotation_version: 1.7.0
  data_yaml: dataset/detection/1.7.0/union_iou0.75_soft0.05/data.yaml
  union_iou_threshold: 0.75
  soft_band: 0.05
  always_separate: false
  train_ratio: 0.8
  min_track_length: 10

model:
  name: yolo11m.pt
  imgsz: 640

training:
  seed: 44
  epochs: 80
  batch_size: 4
  workers: 2
  patience: 15
  iou: 0.7
  conf: 0.25
  project: training/detector_runs
  run_name: bbox_union_iou0.75_soft0.05
