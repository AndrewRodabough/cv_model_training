spec:
  description: DinoCC dance_20 keypoints (DINOv3 + joint-query SimCC)
  handler: main:handler
  runtime: python:3.11
  eventTimeout: 120s
  build:
    image: cvat.pth.dinocc.dance20
    baseImage: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
    directives:
      preCopy:
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: PIP_DISABLE_PIP_VERSION_CHECK=1
        - kind: ENV
          value: HF_HUB_OFFLINE=1
        - kind: ENV
          value: TRANSFORMERS_OFFLINE=1
        - kind: RUN
          value: >
            apt-get update && apt-get install -y --no-install-recommends
            libgl1 libglib2.0-0 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: >
            pip install --no-cache-dir
            "transformers>=4.56.0"
            pillow
            pyyaml
            opencv-python-headless
            "numpy<2"
      postCopy:
        - kind: WORKDIR
          value: /opt/nuclio
  triggers:
    myHttpTrigger:
      kind: http
      maxWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  resources:
    limits:
      nvidia.com/gpu: 1
  platform:
    attributes:
      network: cvat_cvat
      restartPolicy:
        name: always
        maximumRetryCount: 3
